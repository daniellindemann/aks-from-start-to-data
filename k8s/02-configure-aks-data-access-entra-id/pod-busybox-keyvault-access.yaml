kind: Pod
apiVersion: v1
metadata:
  name: test-busybox-keyvault-access
  labels:
    azure.workload.identity/use: "true" # This does the magic and authenticates using workload identity
spec:
  serviceAccountName: "the-service-account" # [REQUIRED] set it to the service account name
  containers:
  - name: busybox
    image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
    command:
    - "/bin/sh"
    - "-c"
    - "while true; do printenv | grep connection-string-beer-rating; sleep 5; done"
    env:
    - name: connection-string-beer-rating
      valueFrom:
        secretKeyRef:
          key: connection-string-beer-rating
          name: appsecrets
    volumeMounts:
    - name: appsecrets
      mountPath: "/mnt/appsecrets"
      readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 32Mi
      limits:
        cpu: 150m
        memory: 64Mi
  volumes:
  - name: appsecrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "beer-rating-secrets" # [REQUIRED] set it to the name of the the secretProviderClass

# ----

# Test via command:
# kubectl exec -it test-busybox-keyvault-access -- printenv | grep connection-string-beer-rating
# and
# kubectl logs -f test-busybox-keyvault-access
